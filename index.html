<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>第一屆生日靈魂繪手挑戰之我們家的動物明星</title>
    <meta name="description" content="隨機抽出一張我們家的動物明星靈魂畫作。" />
    <meta property="og:title" content="第一屆生日靈魂繪手挑戰之我們家的動物明星" />
    <meta property="og:description" content="按一下，隨機抽出一張動物明星畫作。" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <span class="badge">Birthday 2026</span>
        <h1 class="title">
          <span>第一屆生日靈魂繪手挑戰</span>
          <span class="title-sub">之我們家的動物明星</span>
        </h1>
        <p class="lead">每一張都是靈魂畫作，按下按鈕看看今天輪到誰登場。</p>
      </header>

      <section class="card">
        <div class="frame" id="frame" data-state="empty">
          <div class="placeholder" id="placeholder">
            <svg viewBox="0 0 24 24" width="28" height="28" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M4 5h16a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Zm0 11 4.5-4.5a1 1 0 0 1 1.4 0L15 16.5m-1.5-1.5 1.6-1.6a1 1 0 0 1 1.4 0L21 17M15.5 9.5h.01"
              />
            </svg>
            <p>按下按鈕抽出今天的動物明星</p>
          </div>
          <img id="photo" class="photo" alt="動物明星繪畫作品" decoding="async" hidden />
        </div>

        <div class="card-footer">
          <button id="draw" class="button" type="button" disabled>
            <svg class="spinner" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M21 12a9 9 0 1 1-6.22-8.56" />
            </svg>
            <svg class="icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2 18h1.4c1.3 0 2.5-.6 3.3-1.7l6.1-8.6c.7-1.1 2-1.7 3.3-1.7H22m-4-4 4 4-4 4M2 6h1.9c1.5 0 2.9.9 3.6 2.2M22 18h-5.9c-1.3 0-2.6-.7-3.3-1.8l-.5-.8M18 14l4 4-4 4"
              />
            </svg>
            <span class="label">隨機抽一張</span>
          </button>
          <p class="hint" id="status" aria-live="polite"></p>
        </div>
      </section>
    </main>

    <script src="app.js" defer></script>
  </body>
</html>
